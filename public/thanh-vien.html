<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Thành viên | Nguồn cho thuê BĐS Hà Nội</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/portal.css"><script src="/navigation.js" defer></script><script src="/listings-data.js" defer></script><script src="/sharing.js" defer></script><script src="/inventory.js" defer></script><script src="/source-info.js" defer></script><script src="/branding-tool.js" defer></script><script src="/listing-content.js" defer></script><script src="/editor.js" defer></script><script src="/need-matching.js" defer></script><script src="/customer-compare.js" defer></script><script src="/customers.js" defer></script><script src="/portal.js" defer></script></head><body><header><a class="logo" href="/">Nguồn cho thuê BĐS Hà Nội</a><nav class="site-navigation"><a href="/">Trang chủ</a><button type="button" data-back>← Trở về</button></nav></header><main class="portal-shell"><p class="eyebrow">KẾT NỐI NHU CẦU VÀ NGUỒN BĐS</p><h1>Không gian thành viên</h1><p>Khách hàng theo dõi nhu cầu thuê, ký gửi. Sale và cộng tác viên gửi tin sau khi được cấp quyền.</p><p id="portal-status" class="portal-status" role="status"></p><div id="member-auth"><div class="portal-tabs" role="tablist" aria-label="Tài khoản"><button type="button" role="tab" data-auth-tab="login" aria-selected="true">Đăng nhập</button><button type="button" role="tab" data-auth-tab="register" aria-selected="false">Đăng ký thành viên</button></div><form id="member-login" class="portal-card"><h2>Đăng nhập thành viên</h2><label>Email<input type="email" name="email" autocomplete="email" required maxlength="254"></label><label>Mật khẩu<input type="password" name="password" autocomplete="current-password" required minlength="12" maxlength="128"></label><button class="button" type="submit">Đăng nhập</button></form><form id="member-register" class="portal-card" hidden><h2>Đăng ký thành viên</h2><div class="portal-grid"><label>Họ và tên<input name="name" autocomplete="name" required maxlength="100"></label><label>Số điện thoại<input name="phone" type="tel" autocomplete="tel" pattern="(0|\+84)[0-9]{9}" required></label></div><label>Nhóm thành viên<select name="kind"><option value="customer">Khách hàng cần thuê hoặc ký gửi</option><option value="sales">Sale / Cộng tác viên</option></select></label><label>Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>Mật khẩu (ít nhất 12 ký tự)<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label><input type="checkbox" name="consent" required> Tôi đồng ý tạo hồ sơ thành viên và sử dụng thông tin để liên hệ về nhu cầu thuê, ký gửi hoặc cộng tác.</label><button class="button" type="submit">Tạo tài khoản</button></form></div><section id="member-workspace" hidden><div class="portal-top"><p id="member-profile"></p><button class="button outline" id="member-logout">Đăng xuất</button></div><div class="portal-links"><a href="/#tu-van">Đăng ký nhu cầu thuê / Ký gửi</a><a href="/#bat-dong-san">Xem BĐS cho thuê</a></div><p id="posting-permission" class="portal-notice"></p><div id="member-posting" hidden></div><section class="portal-card"><h2>Tin của anh/chị</h2><div id="member-posts"></div></section></section></main></body></html>
